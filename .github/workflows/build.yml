name: Build XR1710G YYH OC firmware

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "Wipe ccache and staging before building"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions: write-all

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      UPSTREAM_REPO: "https://github.com/YYH2913/openwrt.git"
      UPSTREAM_BRANCH: "xr1710g-6.18-integration"
      GH_TOKEN: ${{ github.token }}
      IMG_INC: ghcr.io/${{ github.repository_owner }}/xr1710g-yyh-oc:latest

    steps:
      # ------------------------------------------------------------------
      # 0. Checkout overlay repo.
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Login to GHCR for Docker image caching.
      # ------------------------------------------------------------------
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ------------------------------------------------------------------
      # 2. Seed caches from previous build's Docker image.
      # ------------------------------------------------------------------
      - name: Seed caches from previous build
        run: |
          set -eux
          mkdir -p ccache stcache dlcache openwrt_bin
          docker pull "$IMG_INC" 2>&- || true
          if docker image inspect "$IMG_INC" >/dev/null 2>&1; then
            docker create --name CA "$IMG_INC" >/dev/null
            for d in ccache stcache dlcache; do
              docker cp CA:/$d/. $d 2>/dev/null || true
            done
            docker rm CA
            echo "Restored caches from previous build image"
          else
            echo "No previous build image found, starting fresh"
          fi

      # ------------------------------------------------------------------
      # 3. Wipe caches if requested.
      # ------------------------------------------------------------------
      - name: Wipe caches (optional)
        if: github.event.inputs.clean_cache == 'true'
        run: |
          set -eux
          rm -rf ccache stcache dlcache openwrt_bin
          mkdir -p ccache stcache dlcache openwrt_bin
          echo "Caches wiped"

      # ------------------------------------------------------------------
      # 4. Configure Docker daemon for speed.
      # ------------------------------------------------------------------
      - name: Configure Docker
        run: |
          sudo tee /etc/docker/daemon.json <<< '{"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}'
          sudo systemctl reload docker

      # ------------------------------------------------------------------
      # 5. Start Docker container with mounted caches.
      # ------------------------------------------------------------------
      - name: Start build container
        run: |
          set -eux
          IMAGE="$IMG_INC"
          docker image inspect "$IMAGE" >/dev/null 2>&1 || IMAGE="ubuntu:24.04"
          echo "Using image: $IMAGE"
          docker run -dt --name DK \
            -v "$PWD/ccache":/ccache \
            -v "$PWD/stcache":/stcache \
            -v "$PWD/dlcache":/dlcache \
            -v "$PWD/openwrt_bin":/bld/openwrt_bin \
            -v "$PWD":/workspace \
            "$IMAGE"
          echo "Container started"

      # ------------------------------------------------------------------
      # 6. Prepare OpenWrt source inside container (新增修改 LAN IP 逻辑)
      # ------------------------------------------------------------------
      - name: Prepare OpenWrt source
        run: |
          docker exec -u 0 -i \
            -e DK_OPENWRT="${DK_OPENWRT}" \
            -e DK_BIN="${DK_BIN}" \
            -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
            -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
            -e GH_TOKEN="${GH_TOKEN}" \
            DK bash -euxc '
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              build-essential clang flex bison g++ gawk \
              gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
              rsync swig unzip zlib1g-dev file wget curl ca-certificates \
              python3 python3-pip python3-venv libelf-dev libdw-dev \
              subversion mercurial cvs asciidoc w3m docbook-xsl xsltproc \
              automake autoconf libtool pkg-config cmake ninja-build \
              aria2 jq time ccache golang-go patch

            mkdir -p /bld/openwrt_bin
            rm -rf /bld/openwrt
            mkdir -p /bld/openwrt
            cd /bld/openwrt
            git clone --depth=1 --branch="$UPSTREAM_BRANCH" "$UPSTREAM_REPO" .
            git log -1 --format="Upstream HEAD: %H %s (%ci)"

            rm -rf bin dl staging_dir 2>/dev/null || true
            ln -sf /bld/openwrt_bin bin
            ln -sf /dlcache dl
            ln -sf /stcache staging_dir

            # --- 注入官方 Nikki 软件源 ---
            echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> feeds.conf.default

            ./scripts/feeds update -a
            ./scripts/feeds install -a
            
            # --- 核心修改：将默认 LAN IP 修改为 192.168.10.1 ---
            sed -i "s/192.168.1.1/192.168.10.1/g" package/base-files/files/bin/config_generate
            echo "Default LAN IP changed to 192.168.10.1"

            # 应用本地补丁
            /workspace/scripts/apply-patches.sh /bld/openwrt
            
            # 复制基础硬件配置文件
            cp /workspace/config/xr1710g-oc.conf .config

            # --- 追加 Nikki 核心插件及系统/内核必须依赖 ---
            cat >> .config <<EOF
            # 解决路由包冲突：取消默认简陋版 ip 工具，强制启用 ip-full
            # CONFIG_PACKAGE_ip is not set
            CONFIG_PACKAGE_ip-full=y

            # 基础系统与防火墙组件
            CONFIG_PACKAGE_ca-bundle=y
            CONFIG_PACKAGE_curl=y
            CONFIG_PACKAGE_yq=y
            CONFIG_PACKAGE_firewall4=y

            # Nikki 主程序与 LuCI 简体中文界面
            CONFIG_PACKAGE_nikki=y
            CONFIG_PACKAGE_luci-app-nikki=y
            CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y

            # 核心内核模块 (kmod) - 处理 TPROXY 透明代理与 TUN 模式必须
            CONFIG_PACKAGE_kmod-inet-diag=y
            CONFIG_PACKAGE_kmod-nft-socket=y
            CONFIG_PACKAGE_kmod-nft-tproxy=y
            CONFIG_PACKAGE_kmod-tun=y
            CONFIG_PACKAGE_kmod-dummy=y
            EOF

            # 运行 defconfig 展开配置文件并自动校验依赖关系
            make defconfig

            echo "=== Key config selections ==="
            grep -E "^CONFIG_TARGET|^CONFIG_PACKAGE_nikki|^CONFIG_PACKAGE_kmod-nft|^CONFIG_PACKAGE_kmod-tun|^CONFIG_CCACHE" .config || true
          '

      # ------------------------------------------------------------------
      # 7. Download sources.
      # ------------------------------------------------------------------
      - name: Download sources
        run: |
          docker exec -u 0 -i \
            -e DK_OPENWRT="${DK_OPENWRT}" \
            -e DK_BIN="${DK_BIN}" \
            -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
            -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
            -e GH_TOKEN="${GH_TOKEN}" \
            DK bash -c '
            set -eux
            cd /bld/openwrt
            make -j$(($(nproc) + 1)) download V=s 2>&1 | tail -20
          '

      # ------------------------------------------------------------------
      # 8. Configure ccache and build (自动降级单线程报错容错)
      # ------------------------------------------------------------------
      - name: Compile OpenWrt
        run: |
          docker exec -u 0 -i \
            -e DK_OPENWRT="${DK_OPENWRT}" \
            -e DK_BIN="${DK_BIN}" \
            -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
            -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
            -e GH_TOKEN="${GH_TOKEN}" \
            DK bash -c '
            set -eux
            cd /bld/openwrt
            export FORCE_UNSAFE_CONFIGURE=1
            export CCACHE_DIR=/ccache
            export CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros
            export CCACHE_NOHASHDIR=true
            export CCACHE_COMPILERCHECK=content

            sed -i "s/# CONFIG_CCACHE is not set/CONFIG_CCACHE=y/" .config
            ccache -M 5G
            ccache -z

            make -j$(($(nproc) + 1)) tools/install V=s 2>&1 | tail -20
            make -j$(($(nproc) + 1)) toolchain/install V=s 2>&1 | tail -20

            # 优先全速多线程编译；如果出错，自动降级为单线程 V=s 重新编译并输出详细错误日志
            make -j$(($(nproc) + 1)) || make -j1 V=s

            ccache -s
          '

      # ------------------------------------------------------------------
      # 9. Collect artifacts.
      # ------------------------------------------------------------------
      - name: Collect artifacts
        if: always()
        run: |
          set -eux
          sudo chown -R "$(id -u):$(id -g)" openwrt_bin stcache ccache dlcache 2>/dev/null || true
          mkdir -p artifacts
          {
            echo "Build date: $(date -u)"
            echo "Upstream repo: ${UPSTREAM_REPO}"
            echo "Upstream branch: ${UPSTREAM_BRANCH}"
            echo "Runner: $(uname -m)"
          } > artifacts/BUILD_INFO.txt
          cp -v openwrt_bin/targets/airoha/an7581/*xr1710g* artifacts/ 2>/dev/null || true
          cp -v openwrt_bin/targets/airoha/an7581/*.manifest artifacts/ 2>/dev/null || true
          ls -la artifacts/

      # ------------------------------------------------------------------
      # 10. Upload artifacts (GitHub Actions 临时流水线产物保留完整排错信息)
      # ------------------------------------------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-yyh-oc-firmware-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------
      # 11. Publish to GitHub Releases (修改为仅发布单一 .itb 文件)
      # ------------------------------------------------------------------
      - name: Publish to GitHub Releases
        if: success()
        run: |
          set -euxo pipefail
          sudo chown -R "$(id -u):$(id -g)" openwrt_bin
          mkdir -p release-assets
          
          # --- 严格过滤：仅仅复制 .itb 格式固件 ---
          cp -v openwrt_bin/targets/airoha/an7581/*xr1710g*.itb release-assets/ 2>/dev/null || true
          
          # --- 校验 .itb 文件是否存在 ---
          if ! ls release-assets/*.itb 2>/dev/null | grep -q .; then
            echo "ERROR: No .itb firmware image found for release!"
            exit 1
          fi
          
          TAG="xr1710g-yyh-oc-$(date -u '+%Y%m%d-%H%M%S')"
          
          # --- 仅仅上传 release-assets 下的 .itb 文件到 GitHub Releases ---
          gh release create "${TAG}" release-assets/*.itb \
            --title "XR1710G-YYH-OC $(date -u '+%Y-%m-%d %H:%M')" \
            --notes "ARM native build. Default LAN IP: 192.168.10.1. Upload the .itb file via LuCI > System > Backup/Flash Firmware."
          echo "Release created successfully: ${TAG}"

      # ------------------------------------------------------------------
      # 12. Save build state as Docker image for next run.
      # ------------------------------------------------------------------
      - name: Save build image
        if: always()
        run: |
          set -eux
          docker exec DK bash -c 'cd /bld/openwrt 2>/dev/null && rm -rf bin build_dir feeds tmp' 2>/dev/null || true
          docker commit -a "xr1710g-yyh-oc-builder" -m "Build $(date -u '+%Y-%m-%d %H:%M')" DK "$IMG_INC"
          docker push "$IMG_INC" || true
          echo "Build image saved"
